  <text x="80" y="210" fill="#60a5fa" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" letter-spacing="4">CREATIVE TECHNOLOGY AGENCY</text>
  <text x="80" y="285" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="60" font-weight="700" letter-spacing="1">DIGITAL DOMINANCE</text>
  <text x="80" y="350" fill="rgba(255,255,255,0.45)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="60" font-weight="300" letter-spacing="1">&amp; BRAND STRATEGY</text>

  <text x="80" y="415" fill="rgba(255,255,255,0.65)" font-family="sans-serif" font-size="15">
