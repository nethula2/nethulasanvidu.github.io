  </text>

  <!-- CTA -->
  <rect x="80" y="485" width="220" height="48" rx="4" fill="#60a5fa"/>
  <text x="110" y="515" fill="#000000" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">EXPLORE VENTURE</text>

