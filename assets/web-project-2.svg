<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="50%" stop-color="#101424"/>
      <stop offset="100%" stop-color="#070910"/>
    </linearGradient>
    <radialGradient id="spotlight2" cx="60%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(100, 150, 255, 0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad2)"/>
  <rect width="1280" height="720" fill="url(#spotlight2)"/>

  <!-- Architectural Frame -->
  <line x1="80" y1="100" x2="1200" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="80" y1="620" x2="1200" y2="620" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Nav Header -->
  <text x="80" y="65" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="3">LUME LABS</text>
  <text x="215" y="65" fill="#60a5fa" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" letter-spacing="2">[ DIGITAL STUDIO ]</text>
  
  <text x="560" y="64" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" letter-spacing="2">VENTURES</text>
  <text x="680" y="64" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" letter-spacing="2">CAPABILITIES</text>
