  <rect x="700" y="170" width="480" height="400" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <rect x="730" y="210" width="200" height="150" rx="6" fill="#141828"/>
  <text x="750" y="255" fill="#60a5fa" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2">01 / ARCHITECTURE</text>
  <text x="750" y="290" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">WEB EXPERIENCES</text>
  <text x="750" y="325" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12">Next.js • Node.js • High FPS</text>

  <rect x="950" y="210" width="200" height="150" rx="6" fill="#17192a"/>
