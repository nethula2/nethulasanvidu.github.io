  <text x="970" y="290" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">BRAND SYSTEMS</text>
  <text x="970" y="325" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12">Logos • Guidelines • 3D</text>

  <rect x="730" y="380" width="420" height="150" rx="6" fill="#121522"/>
  <text x="750" y="425" fill="#a78bfa" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="2">03 / PRODUCTION</text>
  <text x="750" y="460" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">MOTION &amp; EDITORIAL VIDEOGRAPHY</text>
  <text x="750" y="495" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12">Commercial Reels • Color Grading • Visual Effects</text>

