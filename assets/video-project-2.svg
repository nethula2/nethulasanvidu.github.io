<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="reelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080e"/>
      <stop offset="50%" stop-color="#0f111d"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <radialGradient id="cinematicGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.18)"/>
      <stop offset="45%" stop-color="rgba(59, 130, 246, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#cbb382"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#reelBg)"/>
  <rect width="1280" height="720" fill="url(#cinematicGlow)"/>

  <!-- Cinema Viewfinder Grid Lines -->
  <line x1="60" y1="60" x2="1220" y2="60" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="60" y1="660" x2="1220" y2="660" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="60" y1="60" x2="60" y2="660" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="1220" y1="60" x2="1220" y2="660" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Viewfinder Corner Crosshairs -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 1200 50 L 1230 50 L 1230 80" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 50 640 L 50 670 L 80 670" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 1200 670 L 1230 670 L 1230 640" fill="none" stroke="#a855f7" stroke-width="2"/>

  <!-- REC Indicator -->
  <circle cx="95" cy="95" r="5" fill="#ef4444"/>
  <text x="110" y="99" fill="#ef4444" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">REC</text>
  <text x="170" y="99" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12" letter-spacing="1">4K RAW // 60 FPS</text>

  <!-- TC & Codec Info -->
  <text x="1060" y="99" fill="#cbb382" font-family="monospace" font-size="12" letter-spacing="2">TC 00:01:48:12</text>

  <!-- Abstract 3D Geometric Orbital Rings in Center -->
  <ellipse cx="640" cy="350" rx="280" ry="90" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" stroke-dasharray="6 6" transform="rotate(-15 640 350)"/>
  <ellipse cx="640" cy="350" rx="310" ry="110" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.5" stroke-dasharray="12 8" transform="rotate(25 640 350)"/>
  <ellipse cx="640" cy="350" rx="240" ry="70" fill="none" stroke="rgba(203, 179, 130, 0.3)" stroke-width="1.2" transform="rotate(-5 640 350)"/>

  <!-- Center Floating Play Glass Emblem -->
  <circle cx="640" cy="350" r="54" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  <circle cx="640" cy="350" r="44" fill="rgba(255, 255, 255, 0.08)"/>
  <polygon points="633,334 656,350 633,366" fill="#ffffff"/>

  <!-- Main Headline -->
  <text x="640" y="470" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="4">COMMERCIAL SHOWREEL</text>
  <text x="640" y="500" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" letter-spacing="2">MOTION DIRECTION • 3D PRODUCT • SOUND DESIGN</text>

  <!-- Audio Spectrum Waveform Indicator -->
  <g transform="translate(540, 545)">
    <rect x="0" y="8" width="4" height="14" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="8" y="4" width="4" height="22" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="16" y="10" width="4" height="10" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="24" y="2" width="4" height="26" rx="2" fill="#a855f7"/>
    <rect x="32" y="6" width="4" height="18" rx="2" fill="#3b82f6"/>
    <rect x="40" y="0" width="4" height="30" rx="2" fill="#ffffff"/>
    <rect x="48" y="4" width="4" height="22" rx="2" fill="#3b82f6"/>
    <rect x="56" y="8" width="4" height="14" rx="2" fill="#a855f7"/>
    <rect x="64" y="12" width="4" height="8" rx="2" fill="rgba(255,255,255,0.4)"/>
    <rect x="72" y="2" width="4" height="26" rx="2" fill="#cbb382"/>
    <rect x="80" y="5" width="4" height="20" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="88" y="10" width="4" height="10" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="96" y="7" width="4" height="16" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="104" y="3" width="4" height="24" rx="2" fill="#3b82f6"/>
    <rect x="112" y="0" width="4" height="30" rx="2" fill="#ffffff"/>
    <rect x="120" y="6" width="4" height="18" rx="2" fill="#a855f7"/>
    <rect x="128" y="11" width="4" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="136" y="4" width="4" height="22" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="144" y="9" width="4" height="12" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="152" y="12" width="4" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="160" y="6" width="4" height="18" rx="2" fill="rgba(255,255,255,0.4)"/>
    <rect x="168" y="10" width="4" height="10" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="176" y="13" width="4" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="184" y="8" width="4" height="14" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="192" y="12" width="4" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Bottom Badges -->
  <text x="95" y="635" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" letter-spacing="2">ADOBE PREMIERE PRO • AFTER EFFECTS • BLENDER 3D</text>
  <text x="1185" y="635" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" letter-spacing="2">© NETHULA SANVIDU</text>
</svg>
