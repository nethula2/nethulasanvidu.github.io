  <rect x="680" y="160" width="240" height="380" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="700" y="180" width="200" height="260" rx="4" fill="#151722"/>
