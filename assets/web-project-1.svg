  <text x="800" y="306" text-anchor="middle" fill="#cbb382" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">01</text>
  <text x="700" y="472" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="600">TAILORED OVERCOAT</text>
  <text x="700" y="497" fill="#cbb382" font-family="sans-serif" font-size="13" font-weight="600">LKR 28,500</text>
  <text x="700" y="522" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" letter-spacing="1">MADE-TO-ORDER</text>

  <rect x="950" y="210" width="240" height="380" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="970" y="230" width="200" height="260" rx="4" fill="#181a28"/>
  <circle cx="1070" cy="350" r="36" fill="rgba(255, 255, 255, 0.08)"/>
  <text x="1070" y="356" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">02</text>
  <text x="970" y="522" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="600">STRUCTURED HOODIE</text>
  <text x="970" y="547" fill="#cbb382" font-family="sans-serif" font-size="13" font-weight="600">LKR 16,000</text>
  <text x="970" y="572" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" letter-spacing="1">LIMITED RUN</text>

  <!-- Bottom Bar -->
  <text x="80" y="655" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" letter-spacing="2">ARCHITECTURE: NODE.JS • MONGODB • RESPONSIVE COMMERCE</text>
  <text x="1200" y="655" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" letter-spacing="2">© 2025 CELISE CLOTHING</text>
