  </text>

  <!-- CTA Button -->
  <rect x="80" y="485" width="210" height="48" rx="4" fill="#ffffff"/>
  <text x="115" y="515" fill="#000000" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DISCOVER PIECES</text>

