<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="50%" stop-color="#12131b"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5c07b"/>
      <stop offset="100%" stop-color="#cbb382"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(203, 179, 130, 0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#spotlight)"/>

  <!-- Subtle Architectural Guides -->
  <line x1="80" y1="100" x2="1200" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="80" y1="620" x2="1200" y2="620" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Navigation Bar -->
  <text x="80" y="65" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="4">CELISE</text>
  <text x="185" y="65" fill="#cbb382" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" letter-spacing="2">[ COUTURE ]</text>
  
  <text x="540" y="64" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" letter-spacing="2">COLLECTION</text>
  <text x="670" y="64" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" letter-spacing="2">EDITORIAL</text>
  <text x="780" y="64" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="13" letter-spacing="2">ATELIER</text>

  <rect x="1100" y="42" width="100" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="1132" y="63" fill="#ffffff" font-family="sans-serif" font-size="12" letter-spacing="1">BAG (0)</text>

  <!-- Hero Content -->
  <text x="80" y="210" fill="#cbb382" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" letter-spacing="4">AUTUMN / WINTER 2025</text>
  <text x="80" y="285" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="2">MONOLITH</text>
  <text x="80" y="350" fill="rgba(255,255,255,0.45)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="300" letter-spacing="2">COLLECTION</text>
  
  <text x="80" y="415" fill="rgba(255,255,255,0.65)" font-family="sans-serif" font-size="15">
    Bespoke made-to-order silhouettes engineered with architectural precision.
  </text>
  <text x="80" y="440" fill="rgba(255,255,255,0.65)" font-family="sans-serif" font-size="15">
